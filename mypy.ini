[mypy]
python_version = 3.13
ignore_missing_imports = True
check_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
show_error_codes = True
pretty = True
exclude = (?x)(
    (^|/)test_.*\.py$
    |(^|/)output/
    |(^|/)archive/
    |(^|/)\.idea_bank/
    |(^|/)\.experiment_ui/
)

# This repository intentionally treats each engine directory as a top-level
# local module path when run from the project root.
mypy_path = experiment_01_discovery:experiment_02_analysis:experiment_ui:transformation_engine:packaging_engine:research_engine:source_acquisition:story_script_engine:format_engine
