name: Static quality audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  checks: write
  statuses: write
  pull-requests: write

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.16.9
      - name: Run focused adversarial lint
        run: ruff check . --select BLE,S,B,F,PLW,E722,ASYNC --output-format=github

  mypy:
    name: mypy type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install mypy
        run: python -m pip install --disable-pip-version-check mypy==2.3.1
      - name: Run mypy
        run: mypy --config-file mypy.ini .

  semgrep:
    name: Semgrep security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check semgrep==1.178.0
      - name: Run Semgrep
        run: semgrep --config p/python --config p/security-audit --error --exclude='**/test_*.py'

  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: MegaLinter Python flavor
        uses: oxsecurity/megalinter/flavors/python@v10.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
