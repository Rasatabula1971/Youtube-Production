name: Quality cleanup

on:
  push:
    branches:
      - fix/pytest-ruff-quality
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pytest-ruff-quality
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install tools
        run: python -m pip install --disable-pip-version-check pytest ruff black pyyaml

      - name: Apply safe Ruff fixes
        run: ruff check . --fix || true

      - name: Apply Black formatting
        run: black .

      - name: Commit mechanical cleanup
        run: |
          if git diff --quiet; then
            echo "No mechanical changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "Apply safe Ruff fixes and Black formatting"
            git push origin HEAD:fix/pytest-ruff-quality
          fi

      - name: Pytest full repository
        run: python -m pytest -q

      - name: Ruff remaining findings
        run: ruff check . --statistics

      - name: Python compile
        run: python -m compileall -q .

      - name: Validate JSON and YAML
        run: |
          python - <<'PY'
          import json
          import pathlib
          import yaml

          for path in pathlib.Path(".").rglob("*.json"):
              if ".git" not in path.parts:
                  json.loads(path.read_text(encoding="utf-8"))
          for path in list(pathlib.Path(".").rglob("*.yml")) + list(pathlib.Path(".").rglob("*.yaml")):
              if ".git" not in path.parts:
                  yaml.safe_load(path.read_text(encoding="utf-8"))
          PY

      - name: JavaScript syntax
        run: node --check experiment_ui/static/app.js
