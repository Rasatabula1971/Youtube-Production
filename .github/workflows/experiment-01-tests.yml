name: Research pipeline tests

on:
  pull_request:
    paths:
      - "core/**"
      - "experiment_01_discovery/**"
      - "experiment_02_analysis/**"
      - "experiment_ui/**"
      - "transformation_engine/**"
      - "research_engine/**"
      - "packaging_engine/**"
      - "source_acquisition/**"
      - "story_script_engine/**"
      - "channel_profiles/**"
      - "format_engine/**"
      - "production_engine/**"
      - "opportunity_engine/**"
      - "Start Experiment UI.bat"
      - "scripts/**"
      - "*.py"
      - "pytest.ini"
      - ".github/workflows/experiment-01-tests.yml"
  push:
    branches: [main]
    paths:
      - "core/**"
      - "experiment_01_discovery/**"
      - "experiment_02_analysis/**"
      - "experiment_ui/**"
      - "transformation_engine/**"
      - "research_engine/**"
      - "packaging_engine/**"
      - "source_acquisition/**"
      - "story_script_engine/**"
      - "channel_profiles/**"
      - "format_engine/**"
      - "production_engine/**"
      - "opportunity_engine/**"
      - "Start Experiment UI.bat"
      - "scripts/**"
      - "*.py"
      - "pytest.ini"
      - ".github/workflows/experiment-01-tests.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Every folder is a package (D-175), so the whole suite runs once from
      # the project root under package-qualified names.
      - name: Run all tests from the project root
        run: python -m unittest discover -s . -t . -p "test_*.py" -v
      - name: Check Experiment UI JavaScript syntax
        if: always()
        run: node --check experiment_ui/static/app.js && for f in experiment_ui/static/js/*.js; do node --check "$f"; done
