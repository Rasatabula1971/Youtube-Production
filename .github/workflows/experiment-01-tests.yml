name: Research pipeline tests

on:
  pull_request:
    paths:
      - "experiment_01_discovery/**"
      - "experiment_02_analysis/**"
      - "experiment_ui/**"
      - "transformation_engine/**"
      - "research_engine/**"
      - "packaging_engine/**"
      - "source_acquisition/**"
      - "story_script_engine/**"
      - "format_engine/**"
      - "production_engine/**"
      - "Start Experiment UI.bat"
      - ".github/workflows/experiment-01-tests.yml"
  push:
    branches: [main]
    paths:
      - "experiment_01_discovery/**"
      - "experiment_02_analysis/**"
      - "experiment_ui/**"
      - "transformation_engine/**"
      - "research_engine/**"
      - "packaging_engine/**"
      - "source_acquisition/**"
      - "story_script_engine/**"
      - "format_engine/**"
      - "production_engine/**"
      - "Start Experiment UI.bat"
      - ".github/workflows/experiment-01-tests.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Experiment 01 tests
        run: python -m unittest discover -s experiment_01_discovery -p "test_*.py" -v
      - name: Run Experiment 02 tests
        run: python -m unittest discover -s experiment_02_analysis -p "test_*.py" -v
      - name: Run Experiment UI tests
        run: python -m unittest discover -s experiment_ui -p "test_*.py" -v
      - name: Check Experiment UI JavaScript syntax
        run: node --check experiment_ui/static/app.js
      - name: Run Transformation Engine tests
        run: python -m unittest discover -s transformation_engine -p "test_*.py" -v
      - name: Run Research Engine tests
        run: python -m unittest discover -s research_engine -p "test_*.py" -v
      - name: Run Packaging Engine tests
        run: python -m unittest discover -s packaging_engine -p "test_*.py" -v
      - name: Run Source Acquisition tests
        run: python -m unittest discover -s source_acquisition -p "test_*.py" -v
      - name: Run Story Script Engine tests
        run: python -m unittest discover -s story_script_engine -p "test_*.py" -v

      - name: Run Format Engine tests
        run: python -m unittest discover -s format_engine -p "test_*.py" -v

      - name: Run Production Engine tests
        run: python -m unittest discover -s production_engine -p "test_*.py" -v
